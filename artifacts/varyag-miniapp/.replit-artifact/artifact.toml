kind = "web"
previewPath = "/"
title = "VARYAG Mini App"
description = "A Telegram Mini App interface for the VARYAG assistant, based on the user's supplied Russian-language HTML dashboard."
version = "1.0.0"
id = "artifacts/varyag-miniapp"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20814

[services.development]
run = "pnpm --filter @workspace/varyag-miniapp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/varyag-miniapp", "run", "build" ]
serve = "static"
publicDir = "artifacts/varyag-miniapp/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20814"
BASE_PATH = "/"
